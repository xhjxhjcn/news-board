name: daily-news

on:
  schedule:
    # 注意：GitHub cron 是 UTC，北京时间 = UTC+8。
    # 全部避开整点：整点是全球排队高峰，本站实测被延后 3-4 小时；
    # 热榜站用 :11 / :35 这类非整点，基本准点。
    - cron: '5 0 * * 1-5'      # 08:05 早参
    - cron: '35 0 * * 1-5'     # 08:35 早参补抓
    - cron: '40 11 * * *'      # 19:40 新闻联播（19:30 播完第一轮）
    - cron: '20 12 * * *'      # 20:20 第二轮（19:40 没抓全时补）
    - cron: '10 14 * * *'      # 22:10 兜底
  workflow_dispatch:
    inputs:
      date:
        description: '指定日期 YYYY-MM-DD（留空 = 今天，作用于新闻联播）'
        required: false
        default: ''
      days:
        description: '回填最近 N 天（优先于 date，作用于新闻联播）'
        required: false
        default: ''

permissions:
  contents: write

# 同一 workflow 的多个 cron / 上一次未跑完的新触发会并发，
# 并发时两个 run 同时 push 到 main 会再次撞上 non-fast-forward。
# 排队执行（cancel-in-progress: false 保证不跳更新）。
concurrency:
  group: daily-news-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整历史，push 前的 rebase 兜底才不会撞 shallow  unrelated-history
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 顺序不可调换：fetch_zaocan 会读 xwlb/index.json[0] 渲染首页的新闻联播入口，
      # 必须**先跑 fetch_news** 把当天条目顶到首位，否则头条永远停在昨天。
      # （2026-10-18 修：原来两条写反了，线上头条一直是前一天的联播。）
      - name: Fetch news（新闻联播）
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.days }}" ]; then
            ARGS="--days ${{ github.event.inputs.days }}"
          elif [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="--date ${{ github.event.inputs.date }}"
          fi
          python scripts/fetch_news.py $ARGS

      - name: Fetch zaocan（早参首页）
        run: python scripts/fetch_zaocan.py --force

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有新内容，跳过提交"
          else
            git commit -m "news: 更新 $(date -u +%Y-%m-%d)"
            # 兜底：万一有并发 run 抢先推了，先把本地 commit 挪到远端之上，
            # 变基为空改动时 rebase 会自动跳过，不会报错。
            git fetch origin main
            git rebase FETCH_HEAD || echo "rebase 失败，尝试直接 push"
            git push
          fi
