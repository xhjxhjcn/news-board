name: daily-news

on:
  schedule:
    # 注意：GitHub cron 是 UTC，北京时间 = UTC+8
    - cron: '0 0 * * 1-5'      # 08:00 早参
    - cron: '30 0 * * 1-5'     # 08:30 早参补抓
    - cron: '0 12 * * *'       # 20:00 新闻联播（19:30 播完后第一轮，2026-10-18 由 21:00 提前）
    - cron: '0 14 * * *'       # 22:00 兜底补抓
  workflow_dispatch:
    inputs:
      date:
        description: '指定日期 YYYY-MM-DD（留空 = 今天，作用于新闻联播）'
        required: false
        default: ''
      days:
        description: '回填最近 N 天（优先于 date，作用于新闻联播）'
        required: false
        default: ''

permissions:
  contents: write

# 同一 workflow 的多个 cron / 上一次未跑完的新触发会并发，
# 并发时两个 run 同时 push 到 main 会再次撞上 non-fast-forward。
# 排队执行（cancel-in-progress: false 保证不跳更新）。
concurrency:
  group: daily-news-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整历史，push 前的 rebase 兜底才不会撞 shallow  unrelated-history
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 顺序不可调换：fetch_zaocan 会读 xwlb/index.json[0] 渲染首页新闻联播入口
      # 卡片，必须等 fetch_news 把当天条目顶到首位之后它读到的才是当天内容。
      - name: Fetch zaocan（早参首页）
        run: python scripts/fetch_zaocan.py --force

      - name: Fetch news（新闻联播）
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.days }}" ]; then
            ARGS="--days ${{ github.event.inputs.days }}"
          elif [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="--date ${{ github.event.inputs.date }}"
          fi
          python scripts/fetch_news.py $ARGS

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有新内容，跳过提交"
          else
            git commit -m "news: 更新 $(date -u +%Y-%m-%d)"
            # 兜底：万一有并发 run 抢先推了，先把本地 commit 挪到远端之上，
            # 变基为空改动时 rebase 会自动跳过，不会报错。
            git fetch origin main
            git rebase FETCH_HEAD || echo "rebase 失败，尝试直接 push"
            git push
          fi
