<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻联播 · 行恒简安</title>
    <meta name="description" content="每日《新闻联播》主要内容图文摘要，每晚自动更新。">
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="site-top">
<!-- site-top:begin -->
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="/" aria-label="回到首页">
                <img src="/assets/logo.png" alt="行恒简安" class="brand-logo">
                <div class="brand-text">
                    <span class="brand-name">行恒简安</span>
                    <span class="brand-slogan">行恒致远 · 简安自得</span>
                </div>
            </a>
            <div class="header-actions">
                <div class="clock">
                    <div class="clock-main">
                        <span class="clock-hm" data-clock-hm>--:--</span>
                        <span class="clock-sec" data-clock-sec>--</span>
                    </div>
                </div>
            </div>
        </div>
    </header>
<!-- site-top:end -->
</div>

    <main class="page-main">
        <nav class="crumb"><a href="/">首页</a><span class="crumb-sep">›</span><span class="cur">新闻联播</span></nav>

        <header class="page-head">
            <div class="ph-main">
                <div class="page-kicker">CCTV · 每日 19:30</div>
                <h1>新闻联播</h1>
            </div>
        </header>

        <div id="notice" class="notice hidden"></div>
        <div id="loading" class="loading">正在加载文章列表……</div>

        <section id="featured"></section>

        <h2 class="section-title">往期回顾<span class="section-note" id="latest-date"></span></h2>
        <section id="archive" class="archive-grid"></section>

    </main>

    <footer class="site-footer">
<!-- site-footer:begin -->
        <div class="footer-inner">
            <div class="footer-brand">
                <img src="/assets/logo.png" alt="" class="footer-logo">
                <div>
                    <div class="footer-name">行恒简安</div>
                    <div class="footer-slogan">行恒致远 · 简安自得</div>
                </div>
            </div>
            <div class="footer-links"><a href="/">今日新闻</a><a href="/xwlb/">新闻联播</a></div>
            <div class="footer-note">内容来源：央视网《新闻联播》（tv.cctv.com），版权归原作者所有，本站仅作个人学习摘要并附原文链接。</div>
            <div class="footer-beian">
                <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">浙ICP备2026078012号</a>
            </div>
            <div class="xhja-mail"><a href="mailto:x@xhja.cn">📧 联系我：x@xhja.cn</a></div>
            <div class="footer-copy">© 2026 行恒简安 · All Rights Reserved</div>
        </div>
<!-- site-footer:end -->
    </footer>


    <script>
        function pad(n) { return n < 10 ? '0' + n : '' + n; }
        function fmtDateCN(d) {
            return d.slice(0, 4) + ' 年 ' + Number(d.slice(5, 7)) + ' 月 ' + Number(d.slice(8, 10)) + ' 日';
        }
        function todayStr() {
            var t = new Date();
            return t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate());
        }
        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function renderFeatured(a) {
            var cover = a.cover
                ? '<img src="' + esc(a.cover) + '" alt="' + esc(fmtDateCN(a.date)) + ' 新闻联播">'
                : '<span class="cover-fallback">暂无封面</span>';
            var heads = (a.titles || []).slice(0, 3).map(function (t) {
                return '<li>' + esc(t) + '</li>';
            }).join('');
            return '<a class="featured-card" href="' + esc(a.url) + '">' +
                '<div class="featured-cover">' + cover + '</div>' +
                '<div class="featured-body">' +
                    '<div class="featured-date"><span class="day">' + a.date.slice(5).replace('-', ' / ') + '</span><span class="rest">' + esc(a.weekday || '') + '</span></div>' +
                    '<h2>《新闻联播》主要内容摘要</h2>' +
                    '<div class="featured-tags"><span class="pill">共 ' + a.count + ' 条</span><span class="pill ghost">图文版</span></div>' +
                    '<ul class="featured-headlines">' + heads + '</ul>' +
                    '<span class="featured-cta">阅读全文 →</span>' +
                '</div>' +
            '</a>';
        }

        function renderArchiveCard(a) {
            var cover = a.cover
                ? '<img src="' + esc(a.cover) + '" alt="' + esc(a.date) + '" loading="lazy">'
                : '';
            return '<a class="archive-card" href="' + esc(a.url) + '">' +
                '<div class="archive-cover">' + cover + '<span class="weekday-badge">' + esc(a.weekday || '') + '</span></div>' +
                '<div class="archive-info">' +
                    '<div class="archive-date">' + fmtDateCN(a.date) + '</div>' +
                    '<div class="archive-sub">共 ' + a.count + ' 条 · ' + (a.titles && a.titles[0] ? esc(a.titles[0]) : '') + '</div>' +
                '</div>' +
            '</a>';
        }

        fetch('index.json', { cache: 'no-cache' })
            .then(function (res) { return res.ok ? res.json() : Promise.reject(new Error('http ' + res.status)); })
            .then(function (list) {
                document.getElementById('loading').classList.add('hidden');
                if (!Array.isArray(list) || !list.length) {
                    document.getElementById('notice').classList.remove('hidden');
                    document.getElementById('notice').textContent = '暂无文章。每天《新闻联播》播出后（约 20:00）会自动更新。';
                    return;
                }
                var today = todayStr();
                if (list[0].date < today) {
                    var n = document.getElementById('notice');
                    n.classList.remove('hidden');
                    n.textContent = '今天的内容还没上线：《新闻联播》每晚 19:30 播出，播完后约 20:00 自动更新，明早来看或晚上再刷新。';
                }
                document.getElementById('featured').innerHTML = renderFeatured(list[0]);
                var ld = document.getElementById('latest-date');
                if (ld) ld.textContent = '最近更新：' + list[0].date;
                var rest = list.slice(1);
                document.getElementById('archive').innerHTML = rest.length
                    ? rest.map(renderArchiveCard).join('')
                    : '<div class="notice">暂时只有最新一期，往期会逐渐积累。</div>';
            })
            .catch(function () {
                document.getElementById('loading').classList.add('hidden');
                var n = document.getElementById('notice');
                n.classList.remove('hidden');
                n.textContent = '文章列表加载失败，请刷新重试（以本地文件方式直接打开时无法读取列表）。';
            });
    </script>
    <script>(function () {
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function tick() {
    var d = new Date();
    var s = [pad(d.getHours()) + ':' + pad(d.getMinutes()), pad(d.getSeconds())];
    var sel = ['[data-clock-hm]', '[data-clock-sec]'];
    for (var i = 0; i < sel.length; i++) {
      var el = document.querySelector(sel[i]);
      if (el && el.textContent !== s[i]) el.textContent = s[i];
    }
  }
  tick();
  setInterval(tick, 1000);
})();</script>
    <script defer src="https://api.xhja.cn/stats.js?site=news"></script>
</body>
</html>
