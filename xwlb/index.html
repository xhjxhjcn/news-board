<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻联播 · 徐宏江的小站</title>
    <meta name="description" content="每日《新闻联播》主要内容图文摘要，每晚自动更新。">
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
    <header class="topbar">
        <a class="back" href="/">← 返回新闻</a>
        <div class="brand">
            <span class="brand-mark">
                <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                    <rect x="1" y="3" width="14" height="10" rx="2"></rect>
                    <path d="M6 13h4v2H6z" opacity="0.7"></path>
                    <path d="M5 6.2v3.6l3.2-1.8z" fill="#fff"></path>
                </svg>
            </span>
            新闻联播
            <span class="brand-sub">每日图文摘要</span>
        </div>
        <a class="home" href="https://www.xhja.cn/" target="_blank" rel="noopener">徐宏江的小站 ↗</a>
    </header>

    <main class="page-main">
        <div id="notice" class="notice hidden"></div>
        <div id="loading" class="loading">正在加载文章列表……</div>

        <section id="featured"></section>

        <h2 class="section-title">往期回顾</h2>
        <section id="archive" class="archive-grid"></section>

        <footer class="page-footer">
            <p>内容来源：央视网《新闻联播》（tv.cctv.com），版权归原作者所有，本站仅作个人学习摘要并附原文链接。</p>
            <p><a href="https://www.xhja.cn/">徐宏江的小站</a> · 每日更新 · <span id="latest-date"></span></p>
        </footer>
    </main>

    <script>
        function pad(n) { return n < 10 ? '0' + n : '' + n; }
        function fmtDateCN(d) {
            return d.slice(0, 4) + ' 年 ' + Number(d.slice(5, 7)) + ' 月 ' + Number(d.slice(8, 10)) + ' 日';
        }
        function todayStr() {
            var t = new Date();
            return t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate());
        }
        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function renderFeatured(a) {
            var cover = a.cover
                ? '<img src="' + esc(a.cover) + '" alt="' + esc(fmtDateCN(a.date)) + ' 新闻联播">'
                : '<span class="cover-fallback">暂无封面</span>';
            var heads = (a.titles || []).slice(0, 3).map(function (t) {
                return '<li>' + esc(t) + '</li>';
            }).join('');
            return '<a class="featured-card" href="' + esc(a.url) + '">' +
                '<div class="featured-cover">' + cover + '</div>' +
                '<div class="featured-body">' +
                    '<div class="featured-date"><span class="day">' + a.date.slice(5).replace('-', ' / ') + '</span><span class="rest">' + esc(a.weekday || '') + '</span></div>' +
                    '<h2>《新闻联播》主要内容摘要</h2>' +
                    '<div class="featured-tags"><span class="pill">共 ' + a.count + ' 条</span><span class="pill ghost">图文版</span></div>' +
                    '<ul class="featured-headlines">' + heads + '</ul>' +
                    '<span class="featured-cta">阅读全文 →</span>' +
                '</div>' +
            '</a>';
        }

        function renderArchiveCard(a) {
            var cover = a.cover
                ? '<img src="' + esc(a.cover) + '" alt="' + esc(a.date) + '" loading="lazy">'
                : '';
            return '<a class="archive-card" href="' + esc(a.url) + '">' +
                '<div class="archive-cover">' + cover + '<span class="weekday-badge">' + esc(a.weekday || '') + '</span></div>' +
                '<div class="archive-info">' +
                    '<div class="archive-date">' + fmtDateCN(a.date) + '</div>' +
                    '<div class="archive-sub">共 ' + a.count + ' 条 · ' + (a.titles && a.titles[0] ? esc(a.titles[0]) : '') + '</div>' +
                '</div>' +
            '</a>';
        }

        fetch('index.json', { cache: 'no-cache' })
            .then(function (res) { return res.ok ? res.json() : Promise.reject(new Error('http ' + res.status)); })
            .then(function (list) {
                document.getElementById('loading').classList.add('hidden');
                if (!Array.isArray(list) || !list.length) {
                    document.getElementById('notice').classList.remove('hidden');
                    document.getElementById('notice').textContent = '暂无文章。每天《新闻联播》播出后（约 21:00）会自动更新。';
                    return;
                }
                var today = todayStr();
                if (list[0].date < today) {
                    var n = document.getElementById('notice');
                    n.classList.remove('hidden');
                    n.textContent = '今天的内容还没上线：《新闻联播》每晚 19:30 播出，播完后约 21:00 自动更新，明早来看或晚上再刷新。';
                }
                document.getElementById('featured').innerHTML = renderFeatured(list[0]);
                document.getElementById('latest-date').textContent = '最近更新：' + list[0].date;
                var rest = list.slice(1);
                document.getElementById('archive').innerHTML = rest.length
                    ? rest.map(renderArchiveCard).join('')
                    : '<div class="notice">暂时只有最新一期，往期会逐渐积累。</div>';
            })
            .catch(function () {
                document.getElementById('loading').classList.add('hidden');
                var n = document.getElementById('notice');
                n.classList.remove('hidden');
                n.textContent = '文章列表加载失败：请通过 http 访问本页（直接双击打开的 html 文件无法读取列表）。';
            });
    </script>
    <script defer src="https://api.xhja.cn/stats.js?site=news"></script>
</body>
</html>
